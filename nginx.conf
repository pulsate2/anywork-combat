# 将 Nginx 工作进程用户设置为 www-data
user www-data;
worker_processes auto;
pid /run/nginx.pid;
# 关闭守护进程模式，以便 Supervisor 或 Docker 可以直接管理 Nginx 进程

error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
	client_max_body_size 100M;
    client_body_buffer_size 256k;

    # 第 1 层 Map：根据请求头决定后端代理地址
    # 这个 map 只在需要代理时才会被用到
    map $http_x_service $backend_server {
        default       "http://127.0.0.1:3456";
        "aionui"      "http://127.0.0.1:25808";
        "lightremote" "http://127.0.0.1:8080";
		"test3000"  "http://127.0.0.1:3000";
		"test"  "http://127.0.0.1:9000";
		"test2"  "http://127.0.0.1:9001";
		"test3"  "http://127.0.0.1:9002";
		"test4"  "http://127.0.0.1:9003";
		"test5"  "http://127.0.0.1:9004";
		"test6"  "http://127.0.0.1:9005";
    }
	
	server{

		listen 3456;
		server_name _;
		location / {	
			root /var/www/html;
		}
		 
	}

    server {
        listen 7860;
        server_name _;

        # 命名 Location 块 2：处理反向代理
        location / {
            proxy_pass $backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
			proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }

}
